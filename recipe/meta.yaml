{% set version = "7.2.0" %}

package:
  name: docker-py
  version: {{ version }}

source:
  url: https://github.com/docker/docker-py/archive/{{ version }}.tar.gz
  sha256: 33487af5bead23974df76aa9e7e44cb555ee939883b9d42a368ce71fb6c18916

build:
  number: 0
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{version}}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python
    - requests >=2.26.0
    - urllib3 >=1.26.0
    - pywin32 >=304  # [win]
    - paramiko >=2.4.3
    - websocket-client >=1.3.0
    - pywin32-on-windows >=304  # [win]
  run_constrained:
    - paramiko >=2.4.3
    - websocket-client >=1.3.0

test:
  imports:
    - docker
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/docker/docker-py/
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: Python client for Docker.
  description: |
    A Python library for the Docker Engine API. It lets you do anything the docker command does,
    but from within Python apps - run containers, manage containers, manage Swarms, etc.
  dev_url: https://github.com/docker/docker-py/
  doc_url: https://docker-py.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf
    - scopatz
    - mariusvniekerk
    - mingwandroid
